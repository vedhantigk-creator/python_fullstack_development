<!DOCTYPE html>
<html>
<head>

    <title>Ecommerce - Home</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body {
            background: #F5F0E6;
            font-family: Arial;
        }

        .hero {
            background:#50C878;
            color: white;
            padding: 100px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 45px;
            font-weight: bold;
        }

        .hero p {
            font-size: 18px;
        }

        .btn-shop {
            background: #E34234;
            color: black;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">

    <a class="navbar-brand" href="{% url 'home' %}">
        Ecommerce
    </a>

    <div>

        <a href="{% url 'home' %}"
           class="text-white me-3">Home</a>

        <a href="{% url 'products' %}"
           class="text-white me-3">Products</a>

        {% if user.is_authenticated %}

            <a href="{% url 'dashboard' %}"
               class="text-white">Dashboard</a>

        {% else %}

            <a href="{% url 'login' %}"
               class="text-white me-3">Login</a>

            <a href="{% url 'register' %}"
               class="text-white">Register</a>

        {% endif %}

    </div>

</nav>



<section class="hero">

    <h1>Welcome to My Ecommerce Store</h1>

    <p>Discover the best products at affordable prices.</p>

    <a href="{% url 'products' %}" class="btn-shop">
        Shop Now
    </a>

</section>

</body>
</html>
